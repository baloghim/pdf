[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-muhely"
version = "0.1.0"
description = "PDF-ek összefűzése és kettévágása asztali felületen"
requires-python = ">=3.10"
dependencies = [
    "pypdf==6.12.0",
    "PySide2==5.15.2.1; sys_platform == 'win32'",
    "PySide6==6.10.2; sys_platform != 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.gui-scripts]
pdf-muhely = "pdf_tool.app:main"

[tool.setuptools.packages.find]
include = ["pdf_tool*"]
