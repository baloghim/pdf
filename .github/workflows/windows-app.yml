name: Windows alkalmazás

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pdf_tool/**'
      - 'tests/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-app.yml'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build, test and package Windows application
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Muhely-Windows-x64
          path: |
            dist/PDF-Muhely-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF-Muhely-Windows-x64
          path: release
      - name: Publish downloadable Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="windows-${BUILD_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" release/* --target "$BUILD_SHA" --latest \
              --title "PDF Műhely – Windows (${BUILD_SHA:0:7})" \
              --notes 'Windows 10/11 x64 hordozható változat. A ZIP teljes tartalmát bontsd ki, és indítsd a PDF-Muhely.exe fájlt. Python telepítése nem szükséges. Nincs digitálisan aláírva. A build Windows Server 2022 rendszeren tesztelt; a Windows 10-es interaktív használat külön ellenőrzést igényel.'
          fi
