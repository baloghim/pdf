name: Alkalmazások és letöltések
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pdf_tool/**'
      - 'tests/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - 'legacy/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    name: Windows (${{ matrix.variant }})
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: modern
            python: '3.12'
            asset: PDF-Muhely-Windows-x64.zip
          - variant: ltsb1607
            python: '3.10'
            asset: PDF-Muhely-Windows-x64-LTSB1607.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Build and test
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Variant '${{ matrix.variant }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.variant }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
  windows-xp:
    name: Windows XP (x86)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build net35 x86 and test under CLR 4
        shell: pwsh
        run: ./packaging/build_windows_xp.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-xp-x86
          path: dist/PDF-Muhely-Windows-XP-x86.zip
          if-no-files-found: error
  macos:
    name: Mac OS (${{ matrix.arch }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/PDF-Muhely-macOS-*.zip
          if-no-files-found: error
  linux:
    name: Linux (DEB, RPM, SH)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graphics and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb rpm libegl1 libgl1 libglib2.0-0 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libsm6 libice6 libx11-xcb1 libxcb-sync1
      - name: Install checksum-verified nfpm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nfpm"
          cd "$RUNNER_TEMP/nfpm"
          curl -fL https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_Linux_x86_64.tar.gz -o nfpm_2.41.3_Linux_x86_64.tar.gz
          curl -fL https://github.com/goreleaser/nfpm/releases/download/v2.41.3/checksums.txt -o checksums.txt
          awk '$2 == "nfpm_2.41.3_Linux_x86_64.tar.gz"' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum -c selected-checksum.txt
          tar -xzf nfpm_2.41.3_Linux_x86_64.tar.gz nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - run: bash packaging/build_linux.sh
      - name: Test DEB installation and graphical SH startup
        run: |
          sudo apt-get install -y ./dist/PDF-Muhely-Linux-x64.deb
          QT_QPA_PLATFORM=offscreen pdf-muhely --smoke-test
          QT_QPA_PLATFORM=xcb xvfb-run -a bash dist/PDF-Muhely-Linux-x64.sh --smoke-test
          rpm -qpl dist/PDF-Muhely-Linux-x64.rpm
      - name: Test RPM installation on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:42 bash -c 'set -e; dnf install -y /packages/PDF-Muhely-Linux-x64.rpm; QT_QPA_PLATFORM=offscreen pdf-muhely --smoke-test'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/PDF-Muhely-Linux-x64.deb
            dist/PDF-Muhely-Linux-x64.rpm
            dist/PDF-Muhely-Linux-x64.sh
          if-no-files-found: error
  release:
    name: Közzététel (8 csomag)
    if: github.ref == 'refs/heads/main'
    needs: [windows, windows-xp, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify all downloads and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for asset in PDF-Muhely-Windows-XP-x86.zip PDF-Muhely-Windows-x64.zip PDF-Muhely-Windows-x64-LTSB1607.zip PDF-Muhely-Linux-x64.deb PDF-Muhely-Linux-x64.rpm PDF-Muhely-Linux-x64.sh PDF-Muhely-macOS-arm64.zip PDF-Muhely-macOS-x86_64.zip; do
            test -s "$asset"
            sha256sum "$asset"
          done > SHA256SUMS.txt
          tag="desktop-${BUILD_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./* --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" ./* --target "$BUILD_SHA" --latest \
              --title "PDF Műhely – minden rendszer (${BUILD_SHA:0:7})" \
              --notes 'Windows XP x86 (.NET 3.5 SP1 szükséges); Windows x64; Windows x64 LTSB 1607 kompatibilitási változat; Linux DEB, RPM és SH; Mac OS Silicon és Intel. Telepítés és rendszerkövetelmények a README-ben. A csomagok nincsenek kiadói tanúsítvánnyal aláírva. Az LTSB 1607 célgépen történő működés külön ellenőrzést igényel.'
          fi
