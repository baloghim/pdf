name: macOS alkalmazás

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pdf_tool/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/macos-app.yml'

permissions:
  contents: read

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate app
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Muhely-macOS-${{ matrix.arch }}
          path: dist/PDF-Muhely-macOS-*.zip
          if-no-files-found: error
          retention-days: 30
